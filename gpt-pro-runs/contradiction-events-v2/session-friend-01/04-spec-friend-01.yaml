# package: contradiction-events-v2-friend-01
# 친구 갈등 사건 — 송다은 A × 최수민 B (손절 + 예비신랑 접근)

context:
  caseId: friend-01
  parties:
    a:
      name: 송다은
      archetype: victim_cosplay
      callTerms: { toJudge: "수민이", angry: "수민아!" }
    b:
      name: 최수민
      archetype: cold_logic
      callTerms: { toJudge: "다은이", angry: "다은아!" }
  disputes:
    visible:
      - { id: d-1, name: "9일간의 연락 의도" }
      - { id: d-2, name: "예비신랑의 선넘는 접근" }
    hidden:
      - { id: h-d3, name: "아버지의 돈 접근 패턴" }
      - { id: h-d4, name: "과거 손절과 아버지의 사기" }
  truths_to_protect:
    - "송다은 아버지의 사기 — 최수민 가족 피해자"
    - "최수민이 과거 사기 피해자였다는 사실"
    - "투자 명목 돈 접근"
    - "이번 결혼 자금 노린 아버지의 시도"
    - "최수민의 경고 메시지 진의"
  banned_lexemes_safe:
    - 아버지
    - 사기
    - 투자
    - 돈
    - 명목
    - 피해자
    - 경고
    - 결혼 자금

spec:
  contradictionEventV2:
    quantity: 24
    distribution_per_dispute:
      a: { safe: 1, partial: 1, full: 1 }
      b: { safe: 1, partial: 1, full: 1 }

  conflictEventV2:
    quantity: 6
    only_for: [d-1, d-2]
    triggerCondition: extreme_only

constraints:
  - "previousStatement/currentStatement는 같은 캐릭터의 발화 변화여야 함."
  - "safe spoilerLevel에서 banned_lexemes_safe 단어가 등장하면 LINT 실패."
  - "친구 사이의 반말/존댓말 혼용 — 재판관에게는 합니다체, 상대에게는 반말."
  - "결혼 3주 전이라는 시간 압박을 발화에 자연스럽게 녹임."

example_safe_contradiction:
  id: "friend-01-d1-b-S2-c1"
  defenderParty: "b"
  defenderLieState: "S2"
  spoilerLevel: "safe"
  previousStatement: "처음에 단순히 안부 인사만 하려 했다고 말씀드렸습니다."
  currentStatement: "...그런데 메시지를 보내야 했던 이유는 좀 더 복잡합니다."
  judgePursuitLine: "최수민 씨, 처음 의도와 지금 설명이 다릅니다. 무엇이 정확합니까?"
  defenderReactionLine: "단순한 안부는 맞는데... 9일이 그냥 흐른 게 아니라서요. 망설인 이유가 있었습니다."
