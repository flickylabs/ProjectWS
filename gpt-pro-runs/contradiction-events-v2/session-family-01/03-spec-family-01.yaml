# package: contradiction-events-v2-family-01
# 형제 분쟁 사건 — 윤태성 A × 윤정후 B (유서 위조 의혹)

context:
  caseId: family-01
  parties:
    a:
      name: 윤태성
      archetype: confrontational
      callTerms: { toJudge: "동생 정후", angry: "정후야!" }
    b:
      name: 윤정후
      archetype: avoidant
      callTerms: { toJudge: "형", angry: "형!" }
  disputes:
    visible:
      - { id: d-1, name: "유서 작성과 판단 능력" }
      - { id: d-2, name: "60:40 유서의 진짜 의도" }
    hidden:
      - { id: h-d3, name: "20년 송금 실체" }
      - { id: h-d4, name: "출생 비밀과 침묵의 이유" }
  truths_to_protect:
    - "출생 비밀 — 다른 부친의 친자"
    - "20년 송금 사실 (정후 → 가족)"
    - "공장 매각 자금 흐름"
    - "일기장에 적힌 친부 정체"
    - "유서 위조의 진짜 동기"
  banned_lexemes_safe:
    - 출생
    - 친부
    - 일기장
    - 20년
    - 송금
    - 공장
    - 위조
    - 매각

spec:
  contradictionEventV2:
    quantity: 24
    distribution_per_dispute:
      a: { safe: 1, partial: 1, full: 1 }
      b: { safe: 1, partial: 1, full: 1 }

  conflictEventV2:
    quantity: 6
    only_for: [d-1, d-2]
    triggerCondition: extreme_only

constraints:
  - "previousStatement/currentStatement는 같은 캐릭터의 발화 변화여야 함."
  - "safe spoilerLevel에서 banned_lexemes_safe 단어가 등장하면 LINT 실패."
  - "judgePursuitLine은 ${name}을(를) 직접 호명하거나 callTerms.toJudge 사용."
  - "형제 호칭(형/동생)은 callTerms 정확히 따름."
  - "유서 위조 자체는 visible(d-2 truth)이지만 출생 비밀(h-d4)은 절대 노출 금지."

example_safe_contradiction:
  id: "family-01-d2-b-S1-c1"
  defenderParty: "b"
  defenderLieState: "S1"
  spoilerLevel: "safe"
  previousStatement: "유서는 어머니가 직접 쓰셨다고 처음 말씀드렸습니다."
  currentStatement: "...정확히 누가 옆에 있었는지는 잘 기억나지 않습니다."
  judgePursuitLine: "윤정후 씨, 처음 답변과 지금 답변이 미묘하게 달라졌습니다."
  defenderReactionLine: "그건 시간이 지나서요... 어머니가 쓰시긴 했는데, 정확한 상황은..."
